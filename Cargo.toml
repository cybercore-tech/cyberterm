[package]
name = "cyberterm"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core Terminal Engine & OS Primitives ---
alacritty_terminal = "0.26.0"   # Core matrix layout state, history buffer, and models --
                                 # also provides the real tty::new (PTY alloc + shell fork/exec)
                                 # and event_loop::EventLoop (PTY read -> vte -> Term wiring)
                                 # this project now uses directly instead of hand-rolling.
winit = "0.30.13"               # Cross-platform window surface manager
# futures is required to cleanly execute wgpu's async initialization methods
futures = "0.3"
wgpu = "24.0.0"                 # Modern low-overhead native GPU interface
glyphon = "0.8"                 # Real GPU text rendering (cosmic-text + etagere), wgpu ^24 --
                                 # verified against crates.io before pinning, matches wgpu above
parking_lot = "0.12"            # Low-overhead synchronization mutex primitive
arboard = { version = "3", features = ["wayland-data-control"] } # Clipboard + primary selection,
                                 # native on Wayland (wlr data-control), X11 otherwise
polling = "3"                   # Same poller alacritty_terminal's PTY loop registers with --
                                 # needed to implement its EventedReadWrite for the OSC tap
                                 # wrapper in shell/tap.rs

# --- Configuration & Engine State Serialization ---
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"              # Comment-preserving edits when saving theme/opacity
serde_json = "1.0.150"
cybercore = "0.8"
